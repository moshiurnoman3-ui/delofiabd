    <!-- Supabase Integration & Fast Loading Logic -->
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://uzlruxpbzncajgytwlnp.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_3ohS1p1TTXb2gbfnx6Wm8w_BUMmheTg";
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage,
                storageKey: 'delofia-customer-auth-v1',
                flowType: 'pkce'
            }
        });
        window.delofiaSupabase = supabase;

        // Optimized initial product fetch
        async function fetchProductsFast() {
            try {
                const { data, error } = await supabase.from('products').select('*').limit(20);
                if (!error && data) {
                    window.products = data;
                    if (typeof renderProducts === 'function') renderProducts();
                }
            } catch (err) {
                console.error("Fast fetch error:", err);
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchProductsFast);
    </script>
